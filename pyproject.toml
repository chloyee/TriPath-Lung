[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripath-lung"
version = "0.2.0"
description = "TriPath-Lung: semantically guided multimodal ordinal response prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "scikit-learn==1.3.0", "torch==2.4.0"]

[project.scripts]
tripath-train = "vlr_mil.train:main"
tripath-test = "vlr_mil.evaluate:main"
tripath-select = "vlr_mil.selection:main"
vlr-train = "vlr_mil.train:main"
vlr-select = "vlr_mil.selection:main"

[tool.setuptools.packages.find]
where = ["src"]
