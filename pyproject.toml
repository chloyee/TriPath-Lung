[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlr-mil-training"
version = "0.1.0"
description = "Concept-guided ordinal multimodal MIL: architecture and five-fold training"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "scikit-learn==1.3.0", "torch==2.4.0"]

[project.scripts]
vlr-train = "vlr_mil.train:main"
vlr-evaluate = "vlr_mil.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
